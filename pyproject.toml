[project]
name = "office-agent-demo"
version = "0.1.0"
description = "办事助手第一阶段 Agent 验证"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-ai-slim[openai]>=1.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.11"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
