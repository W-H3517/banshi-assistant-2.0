[project]
name = "banshi-assistant"
version = "0.1.0"
description = "办事助手：制度知识库与 Agent 对话"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-ai-slim[openai]>=1.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "python-multipart>=0.0.20",
    "opentelemetry-sdk>=1.45.2",
    "pdfplumber>=0.11.10",
    "fastembed>=0.9.1",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    "numpy>=2.5.4",
    "tokenizers>=0.23.3",
    "huggingface-hub>=1.33.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.11",
    "httpx>=0.28",
    "reportlab>=5.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests_stage2"]

[tool.ruff]
target-version = "py312"
line-length = 100
